name: Download EPSS daily

on:
  schedule:
    - cron: '0 2 * * *'  # daily at 02:00 UTC
  workflow_dispatch: {}

jobs:
  download-epss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Archive previous epss_scores.csv (if present)
        run: |
          set -euo pipefail
          mkdir -p epss
          if [ -f epss/epss_scores.csv ]; then
            # get file's modification date in YYYY-MM-DD
            MODDATE=$(date -u -r epss/epss_scores.csv +%F)
            ARCHIVE=epss/epss_scores_${MODDATE}.csv
            echo "Archiving existing epss_scores.csv -> $ARCHIVE"
            mv epss/epss_scores.csv "$ARCHIVE"
          else
            echo "No existing epss/epss_scores.csv to archive"
          fi
          # keep raw daily files; optionally remove older gz files in cleanup step later

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Download EPSS CSV.GZ
        env:
          DATE: ${{ github.event.inputs.date || (github.event.schedule || github.event.workflow_dispatch && github.event.inputs.date) || "$(date -u +%F)" }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%F)
          OUTDIR=epss
          mkdir -p "$OUTDIR"
          URL="https://epss.empiricalsecurity.com/epss_scores-${DATE}.csv.gz"
          OUT_GZ="$OUTDIR/epss_scores-${DATE}.csv.gz"
          echo "Downloading $URL"
          curl -sSfL "$URL" -o "$OUT_GZ"

      - name: Extract and normalize
        run: |
          set -euo pipefail
          DATE=$(date -u +%F)
          OUTDIR=epss
          IN_GZ="$OUTDIR/epss_scores-${DATE}.csv.gz"
          IN_CSV="$OUTDIR/epss_scores-${DATE}.csv"
          NORM="$OUTDIR/epss_scores.csv"
          # Extract
          if command -v gunzip >/dev/null 2>&1; then
            gunzip -c "$IN_GZ" > "$IN_CSV"
          else
            python3 -c "import gzip,sys; print(gzip.open(sys.argv[1],'rt').read())" "$IN_GZ" > "$IN_CSV"
          fi
          # Remove comment lines and write normalized header
          TMP="$NORM.part"
          grep -v '^#' "$IN_CSV" | awk 'NR==1{next} {print}' > "$TMP.data" || true
          printf 'cve,epss,percentile\n' > "$TMP"
          cat "$TMP.data" >> "$TMP"
          mv "$TMP" "$NORM"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: epss_scores
          path: epss/epss_scores.csv

      - name: Cleanup (optional)
        run: |
          # Keep only the last 7 days (optional)
          OUTDIR=epss
          ls -1t "$OUTDIR"/epss_scores-*.csv.gz 2>/dev/null | tail -n +8 | xargs -r rm -f || true


